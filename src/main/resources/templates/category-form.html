<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Category</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
<div class="flex flex-col max-w-full  bg-blue-200 rounded-2xl p-5 min-h-screen m-5">

    <h1 class="items-center font-bold text-3xl py-3">Expense Management Application</h1>
    <hr><hr>
    <br>

    <div class="flex ">
        <h2 class="text-2xl font-bold">Add Category</h2>
        <hr><hr>
        <br>
    </div>
    <br>

    <form action="#" th:action="@{/categories/saveCategory}" th:object="${category}" method="post" class="bg-blue-100 mx-5 p-5 rounded-2xl">

        <label class="font-bold" for="name">Name:</label> <br>
        <input class="outline-1 my-2 w-full rounded-b p-2 bg-white" type="text" id="name" th:field="*{name}" required>
        <br> <br>

        <div>
            <label  for="description" class="font-bold">Description:</label> <br>
            <input class="outline-1 my-2 w-full rounded-b p-2 bg-white" type="text" id="description" th:field="*{description}" required>
        </div>
        <br>

        <button class="my-3 bg-blue-900  hover:bg-blue-800 hover:outline-blue-900 outline-1 text-white px-4 py-2 rounded-full group-hover:bg-blue-700 text-center w-full font-bold " type="submit">Add Category</button>
    </form>




</div>


</body>
</html>
